version: '3.8'

# ==============================================================================
# DATA ENGINEERING PLATFORM: DOCKER COMPOSE CONFIGURATION
# Modular Profiles: milestone-01, milestone-02, full
# Tuned for Low Memory Footprint (< 500MB total container usage)
# ==============================================================================

networks:
  de_network:
    driver: bridge

volumes:
  pg_data:
    driver: local

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 Alpine: Relational Target & Staging DB
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: de_postgres
    restart: unless-stopped
    profiles:
      - milestone-01
      - milestone-02
      - full
    networks:
      - de_network
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-market_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../src/milestone_01_baseline_scripted_ingestion/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    command: >
      postgres 
      -c shared_buffers=128MB 
      -c max_connections=30 
      -c work_mem=4MB
      -c wal_level=logical
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d market_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Milestone 02: Scheduled Batch Ingestion Worker
  # ----------------------------------------------------------------------------
  batch_scheduler:
    build:
      context: ..
      dockerfile: src/milestone_02_containerized_scheduled_batch/Dockerfile
    container_name: de_batch_scheduler

    restart: unless-stopped
    profiles:
      - milestone-02
      - full
    networks:
      - de_network
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_ENGINE: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-market_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass}
      BATCH_SIZE: 25000
      SCHEDULE_INTERVAL_SECONDS: 60
    volumes:
      - ../data:/app/data
    entrypoint: ["python", "-m", "src.milestone_02_containerized_scheduled_batch.scheduler"]

  # ----------------------------------------------------------------------------
  # Milestone 04: MinIO S3-Compatible Object Storage
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: de_minio
    restart: unless-stopped
    profiles:
      - milestone-04
      - full
    networks:
      - de_network
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"

  # ----------------------------------------------------------------------------
  # Milestone 04 & 05: Redpanda (Kafka-compatible broker + Schema Registry)
  # ----------------------------------------------------------------------------
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.10
    container_name: de_redpanda
    restart: unless-stopped
    profiles:
      - milestone-04
      - milestone-05
      - full
    networks:
      - de_network
    ports:
      - "9092:9092"
      - "8081:8081"
      - "9644:9644"
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --schema-registry-addr PLAINTEXT://0.0.0.0:8081

  # ----------------------------------------------------------------------------
  # Milestone 04: Debezium PostgreSQL CDC Connector Engine
  # ----------------------------------------------------------------------------
  debezium:
    image: debezium/connect:2.5
    container_name: de_debezium
    restart: unless-stopped
    profiles:
      - milestone-04
      - full
    networks:
      - de_network
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: redpanda:29092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: my_connect_configs
      OFFSET_STORAGE_TOPIC: my_connect_offsets
      STATUS_STORAGE_TOPIC: my_connect_statuses

  # ----------------------------------------------------------------------------
  # Milestone 05: Prometheus Metrics Scraper
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: de_prometheus
    restart: unless-stopped
    profiles:
      - milestone-05
      - full
    networks:
      - de_network
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  # ----------------------------------------------------------------------------
  # Milestone 05: Grafana Real-Time Observability Dashboard
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.1
    container_name: de_grafana
    restart: unless-stopped
    profiles:
      - milestone-05
      - full
    networks:
      - de_network
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards/json:ro
